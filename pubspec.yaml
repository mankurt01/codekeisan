name: keisan
description: "A new way of ease."
publish_to: 'none'
version: 0.2.6+1

environment:
  sdk: '>=3.9.0-0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.1.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_messaging: ^16.0.0
  firebase_storage: ^13.0.1
  firebase_remote_config: ^6.0.0
  pdf: ^3.10.7
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  logging: ^1.2.0
  file_picker: ^12.0.0-beta.7
  url_launcher: ^6.2.4
  flutter_native_splash: ^2.4.0
  cupertino_icons: ^1.0.6
  intl: ^0.20.2
  flutter_animate: ^4.5.0
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.1
  google_sign_in: ^7.0.0
  sign_in_with_apple: ^8.1.0
  share_plus: ^13.3.0
  icalendar_parser: ^2.1.0
  table_calendar: ^3.1.2
  
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/app_icons/
    
    - assets/sht-ftl_tables.json

# Flutter Launcher Icons configuration
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/app_icons/playstore.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_icons/playstore.png"
  min_sdk_android: 23
  
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Regular.ttf
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700
    # Removed SocialIcons font from firebase_ui_auth package
